appId: com.yaotang.app
productName: 药汤
copyright: 药汤
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
compression: normal
extraResources:
  - from: build/LICENSE.txt
    to: LICENSE.txt
  - from: build/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: build/icon.ico
    to: icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  executableName: YaoTang
  signAndEditExecutable: true
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 药汤
  menuCategory: false
  include: build/installer.nsh
  installerLanguages:
    - zh_CN
  language: "2052"
  unicode: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  uninstallDisplayName: 药汤
  artifactName: YaoTang-Setup-${version}.${ext}
  runAfterFinish: true
